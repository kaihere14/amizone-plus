<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AmizonePlus Viewer</title>
  <style>
    /* Reading-mode layout: one centered column, generous rhythm, no chrome. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fafaf9;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(250, 250, 249, 0.92);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #e5e4e0;
      padding: 10px 24px;
    }

    header .filename {
      max-width: 800px;
      margin: 0 auto;
      font-size: 13px;
      font-weight: 500;
      color: #6b7280;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 24px 96px;
    }

    /* States (loading / error) */
    .state {
      padding: 96px 0;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }

    .state .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-bottom: 12px;
      border: 2px solid #d4d7dc;
      border-top-color: #1f2937;
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Converted document content */
    #doc h1, #doc h2, #doc h3, #doc h4 {
      line-height: 1.3;
      margin: 1.6em 0 0.5em;
    }
    #doc h1 { font-size: 1.5em; }
    #doc h2 { font-size: 1.25em; }
    #doc h3 { font-size: 1.1em; }
    #doc p { margin: 0.7em 0; }
    #doc ul, #doc ol { padding-left: 1.4em; }
    #doc img { max-width: 100%; height: auto; }

    #doc table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.2em 0;
      font-size: 0.95em;
    }
    #doc th, #doc td {
      border: 1px solid #d4d7dc;
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
    }
    #doc th { background: #f1f2f4; }
  </style>
</head>
<body>
  <header><div class="filename" id="filename">&nbsp;</div></header>
  <main>
    <div class="state" id="state"><span class="spinner"></span><br>Converting document…</div>
    <article id="doc"></article>
  </main>
  <script src="lib/mammoth.browser.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
